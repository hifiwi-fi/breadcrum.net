# pnpm settings for a single root package; there are no workspace members.
packages: []

minimumReleaseAgeExclude:
  - undici
  - mine.css
  - neostandard@0.14.0-next

packageExtensions:
  htm:
    peerDependencies:
      preact: "*"

patchedDependencies:
  giscus@1.6.0: patches/giscus@1.6.0.patch

allowBuilds:
  '@sentry/cli': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

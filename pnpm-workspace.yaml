# pnpm settings for a single root package; there are no workspace members.
packages: []

# Scripts must not trigger implicit dependency installation.
verifyDepsBeforeRun: error

minimumReleaseAgeExclude:
  - undici
  - mine.css

packageExtensions:
  htm:
    peerDependencies:
      preact: "*"

peerDependencyRules:
  allowedVersions:
    # Neostandard's TypeScript lint support is disabled; this repo uses TS 7 for tsc only.
    typescript: '7'

patchedDependencies:
  '@domstack/static@12.0.0': patches/@domstack__static@12.0.0.patch
  fastify@5.12.8: patches/fastify@5.12.8.patch
  fastify-cli@8.0.3: patches/fastify-cli@8.0.3.patch
  giscus@1.6.0: patches/giscus@1.6.0.patch

allowBuilds:
  '@sentry/cli': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

name: Regenerate pnpm-lock.yaml

on:
  workflow_dispatch:

permissions: {}

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Keep credentials because the regeneration script pushes its branch.
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 12
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Make script executable
        run: chmod +x .github/scripts/regenerate-lockfile.sh

      - name: Run regenerate lockfile script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/regenerate-lockfile.sh

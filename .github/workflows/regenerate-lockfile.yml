name: Regenerate pnpm-lock.yaml

on:
  workflow_dispatch:

permissions: {}

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Keep credentials because the regeneration script pushes its branch.
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Make script executable
        run: chmod +x .github/scripts/regenerate-lockfile.sh

      - name: Run regenerate lockfile script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/regenerate-lockfile.sh

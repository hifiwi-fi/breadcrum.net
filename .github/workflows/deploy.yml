name: flyctl deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: "Deploy the shared image to both API and worker process groups"
        default: false

env:
  FORCE_COLOR: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/breadcrum

permissions: {}

concurrency:
  group: breadcrum-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: breadcrum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Install Redis executable for isolated runtime tests
        run: |
          sudo apt-get update
          # The shared Redis service container already owns port 6379.
          sudo systemctl mask redis-server.service
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - run: pnpm install --frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          path: pnpm-lock.yaml
          archive: false
      - run: pnpm run generate-default-env
      - run: pnpm run migrate
        env:
          PGDATABASE: breadcrum
          PGHOST: localhost
          PGPASSWORD: postgres
          PGPORT: 5432
          PGUSER: postgres
      - name: Restore GeoIP cache
        id: cache-geoip-restore
        uses: actions/cache/restore@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
          restore-keys: |
            geoip-root-${{ runner.os }}-
      - name: Update GeoIP data
        id: update-geoip
        continue-on-error: true
        run: node scripts/api/update-geoip-db.js
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Save GeoIP cache
        if: steps.update-geoip.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
      - run: node scripts/verify-giscus-patch.js
      - run: pnpm run build
      - run: node scripts/verify-giscus-patch.js --built
      - run: pnpm test
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          SKIP_GEOIP_TESTS: ${{ steps.update-geoip.outcome != 'success' && '1' || '0' }}
      - name: Deploy API and worker
        run: pnpm run deploy
        if: ${{ inputs.deploy }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}


name: npm bump

on:
  workflow_dispatch:
    inputs:
      newversion:
        description: "npm version (YYYY.MM.DD)"
        required: false
      deploy:
        type: boolean
        description: "Deploy the shared image to both API and worker process groups"
        default: false

permissions: {}

env:
  FORCE_COLOR: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/breadcrum

concurrency:
  group: breadcrum-production-release
  cancel-in-progress: false

jobs:
  version_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: breadcrum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep credentials because npm-bump pushes the release commit and tag.
          persist-credentials: true
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Install Redis executable for isolated runtime tests
        run: |
          sudo apt-get update
          # The shared Redis service container already owns port 6379.
          sudo systemctl mask redis-server.service
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - run: pnpm install --frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          path: pnpm-lock.yaml
          archive: false
      - run: pnpm run generate-default-env
      - run: pnpm run migrate
        env:
          PGDATABASE: breadcrum
          PGHOST: localhost
          PGPASSWORD: postgres
          PGPORT: 5432
          PGUSER: postgres
      - name: Restore GeoIP cache
        id: cache-geoip-restore
        uses: actions/cache/restore@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
          restore-keys: |
            geoip-root-${{ runner.os }}-
      - name: Update GeoIP data
        id: update-geoip
        continue-on-error: true
        run: node scripts/api/update-geoip-db.js
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Save GeoIP cache
        if: steps.update-geoip.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
      - run: node scripts/verify-giscus-patch.js
      - run: pnpm run build
      - run: node scripts/verify-giscus-patch.js --built
      - run: pnpm test
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          SKIP_GEOIP_TESTS: ${{ steps.update-geoip.outcome != 'success' && '1' || '0' }}
      - name: Set NEW_VERSION
        env:
          INPUT_NEW_VERSION: ${{ github.event.inputs.newversion }}
          REPOSITORY_PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          if [ -z "$INPUT_NEW_VERSION" ]; then
            NEW_VERSION=$(date -d "$REPOSITORY_PUSHED_AT" +%Y.%m.%d)
          elif [[ "$INPUT_NEW_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            NEW_VERSION=$INPUT_NEW_VERSION
          else
            echo "newversion must use YYYY.M.D format" >&2
            exit 1
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "$NEW_VERSION"
      - uses: bcomnes/npm-bump@8e67058c250579782ed12d6e591c8d07b7b0cae4 # v3
        with:
          git-email: bcomnes@gmail.com
          git-username: ${{ github.actor }}
          new-version: ${{ env.NEW_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-cmd: pnpm run release
      - name: Deploy API and worker
        run: pnpm run deploy
        if: ${{ inputs.deploy }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}


name: tests

on: [pull_request, push]

env:
  FORCE_COLOR: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/breadcrum

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: breadcrum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install Redis executable for isolated runtime tests
        run: |
          sudo apt-get update
          # The shared Redis service container already owns port 6379.
          sudo systemctl mask redis-server.service
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - run: pnpm install --frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          path: pnpm-lock.yaml
          archive: false
      - run: pnpm run generate-default-env
      - run: pnpm run migrate
        env:
          PGDATABASE: breadcrum
          PGHOST: localhost
          PGPASSWORD: postgres
          PGPORT: 5432
          PGUSER: postgres
      - name: Restore GeoIP cache
        id: cache-geoip-restore
        uses: actions/cache/restore@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
          restore-keys: |
            geoip-root-${{ runner.os }}-
      - name: Update GeoIP data
        id: update-geoip
        continue-on-error: true
        run: node scripts/api/update-geoip-db.js
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Save GeoIP cache
        if: steps.update-geoip.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/geoip
          key: geoip-root-${{ runner.os }}-${{ hashFiles('data/geoip/**') }}
      - run: node scripts/verify-giscus-patch.js
      - run: pnpm run build
      - run: node scripts/verify-giscus-patch.js --built
      - name: Test
        run: pnpm test
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          SKIP_GEOIP_TESTS: ${{ steps.update-geoip.outcome != 'success' && '1' || '0' }}

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: "lcov.info"

  coverage:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true

  automerge:
    needs: test
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          startsWith(github.head_ref, 'dependabot/github_actions/actions/') ||
          startsWith(github.head_ref, 'dependabot/github_actions/github/codeql-action/')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Merge first-party GitHub Actions Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
